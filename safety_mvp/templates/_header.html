{% if user.is_authenticated %}
<style>
    body.dark-mode {
        background: #0f172a !important;
        color: #e2e8f0 !important;
    }

    body.dark-mode .content,
    body.dark-mode .panel,
    body.dark-mode .metric,
    body.dark-mode .table-panel,
    body.dark-mode .topbar,
    body.dark-mode .info-card,
    body.dark-mode .context-box {
        background: #1e293b !important;
        color: #e2e8f0 !important;
        border-color: #334155 !important;
    }

    body.dark-mode th,
    body.dark-mode td,
    body.dark-mode .muted,
    body.dark-mode .records-meta,
    body.dark-mode .helptext,
    body.dark-mode label {
        color: #cbd5e1 !important;
        border-color: #334155 !important;
    }

    body.dark-mode input,
    body.dark-mode select,
    body.dark-mode textarea {
        background: #0f172a !important;
        color: #e2e8f0 !important;
        border-color: #334155 !important;
    }

    body.dark-mode .menu-group a.active,
    body.dark-mode .menu-group a:hover {
        background: #285266 !important;
    }

    body.dark-mode .user-menu {
        background: #1e293b !important;
        border-color: #334155 !important;
    }

    body.dark-mode .user-menu a,
    body.dark-mode .user-menu button {
        color: #e2e8f0 !important;
    }
</style>
<header class="header" style="position: sticky; top: 0; z-index: 1000; background: linear-gradient(90deg, #0f2c35 0%, #123845 100%); color: #d3e5ec; padding: 0 24px; height: 60px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);">
    <div style="display: flex; align-items: center; gap: 12px;">
        <div style="font-family: 'Space Grotesk', sans-serif; font-size: 1.3rem; font-weight: 700; color: #4fb3a3;">◊</div>
        <div style="display: flex; flex-direction: column; font-size: 0.75rem; line-height: 1.2;">
            <div style="font-weight: 700; font-size: 0.85rem;">Di-VisioN</div>
            <div style="color: #8eb1bd; font-size: 0.7rem;">ISO Toolkit</div>
        </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
        <button id="themeToggleBtn" type="button" title="Toggle dark mode" style="background: none; border: none; color: #d3e5ec; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 8px; transition: background 0.2s ease, color 0.2s ease;" onmouseover="this.style.background='rgba(79,179,163,0.2)'" onmouseout="this.style.background='none'">
            <svg id="themeSunIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="themeMoonIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3c0.5 0 0.8 0.6 0.5 1A7 7 0 1 0 20 13.29c0.4-0.3 1 0 1 0.5z"></path>
            </svg>
        </button>
        <div style="position: relative;" class="user-dropdown">
            <button class="user-menu-trigger" onclick="toggleUserMenu(event)" style="background: none; border: none; color: #d3e5ec; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; transition: background 0.2s ease;">
                <div style="width: 32px; height: 32px; border-radius: 50%; background: #4fb3a3; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; color: white;">{{ user.first_name|first|upper }}{{ user.last_name|first|upper }}</div>
                <span style="font-size: 0.875rem;">{{ user.first_name|default:user.username }}</span>
            </button>
            <div class="user-menu" id="userMenu" style="position: absolute; top: 100%; right: 0; background: white; border: 1px solid #dfe6e8; border-radius: 8px; min-width: 180px; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1); margin-top: 8px; display: none;">
                <a href="/app/profile/" style="display: block; padding: 12px 16px; color: #17313b; text-decoration: none; font-size: 0.9rem; border-radius: 8px 8px 0 0;">Profile</a>
                <a href="/app/settings/" style="display: block; padding: 12px 16px; color: #17313b; text-decoration: none; font-size: 0.9rem;">Settings</a>
            </div>
        </div>
        <!-- Logout icon button -->
        <form method="post" action="/logout/" style="margin: 0;">
            {% csrf_token %}
            <button type="submit" title="Logout" style="background: none; border: none; color: #d3e5ec; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 8px; transition: background 0.2s ease, color 0.2s ease;" onmouseover="this.style.background='rgba(196,68,47,0.25)';this.style.color='#ff7a6a';" onmouseout="this.style.background='none';this.style.color='#d3e5ec';">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </form>
    </div>
</header>
<script>
    function applyTheme(mode) {
        const isDark = mode === 'dark';
        document.body.classList.toggle('dark-mode', isDark);
        const sunIcon = document.getElementById('themeSunIcon');
        const moonIcon = document.getElementById('themeMoonIcon');
        if (sunIcon && moonIcon) {
            sunIcon.style.display = isDark ? 'block' : 'none';
            moonIcon.style.display = isDark ? 'none' : 'block';
        }
    }

    function toggleTheme() {
        const nextMode = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
        localStorage.setItem('dv-theme', nextMode);
        applyTheme(nextMode);
    }

    const savedTheme = localStorage.getItem('dv-theme') || 'light';
    applyTheme(savedTheme);

    const themeToggleBtn = document.getElementById('themeToggleBtn');
    if (themeToggleBtn) {
        themeToggleBtn.addEventListener('click', toggleTheme);
    }

    function toggleUserMenu(event) {
        event.preventDefault();
        const menu = document.getElementById('userMenu');
        menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }

    document.addEventListener('click', function(event) {
        const menu = document.getElementById('userMenu');
        const trigger = event.target.closest('.user-menu-trigger');
        if (!trigger && menu) {
            menu.style.display = 'none';
        }
    });
</script>
{% endif %}
