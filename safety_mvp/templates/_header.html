{% if user.is_authenticated %}
<style>
    /* ── Dark mode overrides ───────────────────────────────────── */
    body.dark-mode {
        background: #0f172a !important;
        color: #e2e8f0 !important;
    }

    body.dark-mode .content,
    body.dark-mode .panel,
    body.dark-mode .metric,
    body.dark-mode .table-panel,
    body.dark-mode .topbar,
    body.dark-mode .info-card,
    body.dark-mode .context-box,
    body.dark-mode .card,
    body.dark-mode .module-card,
    body.dark-mode .activity,
    body.dark-mode .content > .header {
        background: #1e293b !important;
        color: #e2e8f0 !important;
        border-color: #334155 !important;
    }

    body.dark-mode .card h1,
    body.dark-mode .card h2,
    body.dark-mode .card h3,
    body.dark-mode .module-card h1,
    body.dark-mode .module-card h2,
    body.dark-mode .module-card h3,
    body.dark-mode .activity h1,
    body.dark-mode .activity h2,
    body.dark-mode .activity h3,
    body.dark-mode .content > .header h1,
    body.dark-mode .content > .header h2,
    body.dark-mode .content > .header h3 { color: #f1f5f9 !important; }

    body.dark-mode th,
    body.dark-mode td,
    body.dark-mode .muted,
    body.dark-mode .records-meta,
    body.dark-mode .helptext,
    body.dark-mode label,
    body.dark-mode .meta,
    body.dark-mode .count,
    body.dark-mode .kpis div,
    body.dark-mode .header p { color: #cbd5e1 !important; border-color: #334155 !important; }

    body.dark-mode .action-link,
    body.dark-mode .action-btn { background: #0f172a !important; color: #e2e8f0 !important; border-color: #334155 !important; }

    body.dark-mode .action-link.manage,
    body.dark-mode .action-btn.manage,
    body.dark-mode .module-card a,
    body.dark-mode .cta,
    body.dark-mode .btn { color: #ffffff !important; }

    body.dark-mode input,
    body.dark-mode select,
    body.dark-mode textarea { background: #0f172a !important; color: #e2e8f0 !important; border-color: #334155 !important; }

    body.dark-mode .menu-group a.active,
    body.dark-mode .menu-group a:hover { background: #285266 !important; }

    body.dark-mode .user-menu { background: #1e293b !important; border-color: #334155 !important; }
    body.dark-mode .user-menu a,
    body.dark-mode .user-menu button { color: #e2e8f0 !important; }

    body.dark-mode .mobile-bottom-nav {
        background: #0a1929 !important;
        border-top-color: rgba(79, 179, 163, 0.2) !important;
    }

    /* ── Sidebar overlay ───────────────────────────────────────── */
    .sidebar-overlay {
        display: none;
        position: fixed;
        top: 60px;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.55);
        z-index: 999;
        backdrop-filter: blur(2px);
    }
    .sidebar-overlay.active { display: block; }

    /* ── Mobile bottom navigation bar ─────────────────────────── */
    .mobile-bottom-nav {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 64px;
        background: #0f2c35;
        border-top: 1px solid rgba(79, 179, 163, 0.22);
        z-index: 1100;
        padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .mobile-bottom-nav a,
    .mobile-bottom-nav button.mob-tab {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #8eb1bd;
        text-decoration: none;
        font-family: 'Manrope', sans-serif;
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        gap: 3px;
        background: none;
        border: none;
        border-top: 2px solid transparent;
        cursor: pointer;
        padding: 5px 2px 6px;
        transition: color 0.15s, border-color 0.15s;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
    }

    .mobile-bottom-nav a.mob-active,
    .mobile-bottom-nav button.mob-tab.mob-active {
        color: #4fb3a3;
        border-top-color: #4fb3a3;
    }

    .mobile-bottom-nav svg {
        width: 22px;
        height: 22px;
        stroke-width: 1.8;
        flex-shrink: 0;
    }

    /* ── Mobile global overrides ───────────────────────────────── */
    @media (max-width: 768px) {
        .mobile-bottom-nav {
            display: flex;
        }

        body {
            padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)) !important;
        }

        /* Hide username text in header — keep avatar only */
        .user-name-text { display: none !important; }

        /* Always show hamburger on phones */
        #sidebarToggleBtn { display: flex !important; }

        /* Sidebar is a full drawer on phones */
        .sidebar {
            position: fixed !important;
            left: 0 !important;
            top: 60px !important;
            width: 82vw !important;
            max-width: 300px !important;
            height: calc(100vh - 60px) !important;
            transform: translateX(-100%) !important;
            transition: transform 0.28s cubic-bezier(.4,0,.2,1) !important;
            z-index: 1001 !important;
            border-bottom: none !important;
        }

        .sidebar.drawer-open {
            transform: translateX(0) !important;
        }

        /* Close sidebar links on tap */
        .sidebar a { min-height: 44px; display: flex; align-items: center; }
    }

    @media (max-width: 1024px) {
        #sidebarToggleBtn {
            display: flex !important;
            align-items: center;
            justify-content: center;
        }
    }
</style>

<header style="position: sticky; top: 0; z-index: 1000; background: linear-gradient(90deg, #0f2c35 0%, #123845 100%); color: #d3e5ec; padding: 0 20px; height: 60px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.18);">
    <div style="display: flex; align-items: center; gap: 10px;">
        <button id="sidebarToggleBtn" type="button" title="Menu" style="display:none; background:none; border:none; color:#d3e5ec; cursor:pointer; width:44px; height:44px; border-radius:8px; align-items:center; justify-content:center; transition:background 0.2s;" onmouseover="this.style.background='rgba(79,179,163,0.2)'" onmouseout="this.style.background='none'">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
        <div style="font-family:'Space Grotesk',sans-serif; font-size:1.25rem; font-weight:700; color:#4fb3a3;">&#9674;</div>
        <div style="display:flex; flex-direction:column; line-height:1.2;">
            <div style="font-weight:700; font-size:0.85rem;">Di-VisioN</div>
            <div style="color:#8eb1bd; font-size:0.68rem;">ISO Toolkit</div>
        </div>
    </div>

    <div style="display:flex; align-items:center; gap:6px;">
        <!-- Theme toggle -->
        <button id="themeToggleBtn" type="button" title="Toggle dark mode" style="background:none; border:none; color:#d3e5ec; cursor:pointer; display:flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:8px; transition:background 0.2s;" onmouseover="this.style.background='rgba(79,179,163,0.2)'" onmouseout="this.style.background='none'">
            <svg id="themeSunIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg id="themeMoonIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3c0.5 0 0.8 0.6 0.5 1A7 7 0 1 0 20 13.29c0.4-0.3 1 0 1 0.5z"/>
            </svg>
        </button>

        <!-- User dropdown -->
        <div style="position:relative;" class="user-dropdown">
            <button class="user-menu-trigger" onclick="toggleUserMenu(event)" style="background:none; border:none; color:#d3e5ec; cursor:pointer; display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:8px; transition:background 0.2s;">
                <div style="width:34px; height:34px; border-radius:50%; background:#4fb3a3; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.9rem; color:white; flex-shrink:0;">{{ user.first_name|first|upper }}{{ user.last_name|first|upper }}</div>
                <span class="user-name-text" style="font-size:0.875rem;">{{ user.first_name|default:user.username }}</span>
            </button>
            <div class="user-menu" id="userMenu" style="position:absolute; top:100%; right:0; background:white; border:1px solid #dfe6e8; border-radius:10px; min-width:180px; box-shadow:0 8px 20px rgba(0,0,0,0.12); margin-top:8px; display:none; overflow:hidden;">
                <form method="post" action="/logout/" style="margin:0;">
                    {% csrf_token %}
                    <button type="submit" style="width:100%; text-align:left; padding:14px 16px; border:none; background:none; color:#c4442f; cursor:pointer; font-size:0.9rem; font-family:inherit; font-weight:600;">Sign out</button>
                </form>
            </div>
        </div>

        <!-- Logout -->
        <form method="post" action="/logout/" style="margin:0;">
            {% csrf_token %}
            <button type="submit" title="Logout" style="background:none; border:none; color:#d3e5ec; cursor:pointer; display:flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:8px; transition:background 0.2s, color 0.2s;" onmouseover="this.style.background='rgba(196,68,47,0.25)';this.style.color='#ff7a6a';" onmouseout="this.style.background='none';this.style.color='#d3e5ec';">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </form>
    </div>
</header>

<!-- Mobile bottom navigation -->

        </svg>

<script>
    /* ── Theme ─────────────────────────────────────────────────── */
    function applyTheme(mode) {
        const isDark = mode === 'dark';
        document.body.classList.toggle('dark-mode', isDark);
        const sun = document.getElementById('themeSunIcon');
        const moon = document.getElementById('themeMoonIcon');
        if (sun) sun.style.display = isDark ? 'block' : 'none';
        if (moon) moon.style.display = isDark ? 'none' : 'block';
    }

    function toggleTheme() {
        const next = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
        localStorage.setItem('dv-theme', next);
        applyTheme(next);
    }

    applyTheme(localStorage.getItem('dv-theme') || 'light');

    const themeBtn = document.getElementById('themeToggleBtn');
    if (themeBtn) themeBtn.addEventListener('click', toggleTheme);

    /* ── User menu ─────────────────────────────────────────────── */
    function toggleUserMenu(e) {
        e.preventDefault();
        const menu = document.getElementById('userMenu');
        menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }

    document.addEventListener('click', function(e) {
        const menu = document.getElementById('userMenu');
        if (!e.target.closest('.user-dropdown') && menu) {
            menu.style.display = 'none';
        }
    });

    /* ── Sidebar drawer (shared logic) ─────────────────────────── */
    function getSidebar() { return document.querySelector('.sidebar'); }

    function getOrCreateOverlay() {
        let overlay = document.querySelector('.sidebar-overlay');
        if (!overlay) {
            overlay = document.createElement('div');
            overlay.className = 'sidebar-overlay';
            document.body.appendChild(overlay);
            overlay.addEventListener('click', closeMobileDrawer);
        }
        return overlay;
    }

    function openMobileDrawer() {
        const sb = getSidebar();
        const ov = getOrCreateOverlay();
        if (sb) sb.classList.add('drawer-open');
        ov.classList.add('active');
        const menuBtn = document.getElementById('mnav-menu');
        if (menuBtn) menuBtn.classList.add('mob-active');
    }

    function closeMobileDrawer() {
        const sb = getSidebar();
        const ov = document.querySelector('.sidebar-overlay');
        if (sb) sb.classList.remove('drawer-open');
        if (ov) ov.classList.remove('active');
        const menuBtn = document.getElementById('mnav-menu');
        if (menuBtn) menuBtn.classList.remove('mob-active');
    }

    function toggleMobileDrawer() {
        const sb = getSidebar();
        if (sb && sb.classList.contains('drawer-open')) {
            closeMobileDrawer();
        } else {
            openMobileDrawer();
        }
    }

    /* Hamburger button in header */
    const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
    if (sidebarToggleBtn) {
        sidebarToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMobileDrawer();
        });
    }

    /* Close drawer when a sidebar link is tapped on mobile */
    document.addEventListener('DOMContentLoaded', function() {
        getOrCreateOverlay();
        const sb = getSidebar();
        if (sb) {
            sb.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    if (window.innerWidth <= 768) closeMobileDrawer();
                });
            });
        }
    });

    /* ── Bottom nav active state ───────────────────────────────── */
    (function() {
        const path = window.location.pathname;
        const navItems = [
            { id: 'mnav-home',       test: p => p === '/' || p === '/dashboard/' },
            { id: 'mnav-incidents',  test: p => p.startsWith('/app/incidents') },
            { id: 'mnav-checklists', test: p => p.startsWith('/app/checklists') },
            { id: 'mnav-jsa',        test: p => p.startsWith('/app/jsa') },
        ];
        let matched = false;
        for (const item of navItems) {
            if (item.test(path)) {
                const el = document.getElementById(item.id);
                if (el) el.classList.add('mob-active');
                matched = true;
            }
        }
        /* Highlight Menu tab for all other module pages */
        if (!matched && path !== '/') {
            const el = document.getElementById('mnav-menu');
            if (el) el.classList.add('mob-active');
        }
    })();
</script>
{% endif %}
